name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GJS and GLib schema tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs libglib2.0-bin
      - run: make test
